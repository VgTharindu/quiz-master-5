<!doctype html>
<html lang="si">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QUIZ MASTER 5 | Grade 5 Scholarship Learning Platform</title>
    <meta name="description" content="චාමර සර්ගේ 5 වසර ශිෂ්‍යත්ව පන්තියේ online අභ්‍යාස පරීක්ෂණ" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open connections early to cut latency on slow networks. Vite replaces %VITE_SUPABASE_URL% at build time. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-blocking font load: render with system fonts first, then swap (display=swap). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Gemunu+Libre:wght@600;800&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Gemunu+Libre:wght@600;800&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>

  </body>
